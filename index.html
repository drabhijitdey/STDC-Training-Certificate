<!DOCTYPE html>
<html>
<head>
    <title>NTEP Certificate Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body{
            text-align:center;
            font-family:Arial;
            margin-top:40px;
        }

        input{
            padding:10px;
            width:300px;
            margin:10px;
            font-size:18px;
        }

        button{
            padding:12px 25px;
            font-size:18px;
            cursor:pointer;
        }
    </style>
</head>

<body>

    <h2>NTEP Certificate Generator</h2>

    <input type="text" id="name" placeholder="Enter Name"><br>

    <input type="text" id="date" placeholder="Enter Date"><br>

    <button onclick="generateCertificate()">Download Certificate</button>

    <script>
        async function generateCertificate() {

            const { jsPDF } = window.jspdf;

            let name = document.getElementById("name").value;
            let date = document.getElementById("date").value;

            if (!name || !date) {
                alert("Please enter both Name and Date");
                return;
            }

            const pdf = new jsPDF('landscape', 'px', [842, 595]);

            let img = new Image();

            img.onload = function () {

                pdf.addImage(img, 'JPEG', 0, 0, 842, 595);

                // BLUE INK
                pdf.setTextColor(0, 0, 255);

                // NAME
                pdf.setFont("times", "bolditalic");
                pdf.setFontSize(32);
                pdf.text(name, 421, 340, { align: "center" });

                // DATE
                pdf.setFont("helvetica", "normal");
                pdf.setFontSize(20);

                // DATE MOVED SLIGHTLY LOWER
                pdf.text(date, 405, 404);

                pdf.save(name + "_certificate.pdf");
            };

            img.onerror = function () {
                alert("certificate.jpg not found.");
            };

            img.src = "certificate.jpg";
        }
    </script>

</body>
</html>
